name: Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: friendly-doc-assistant-${{ github.ref }}
  cancel-in-progress: false

env:
  SAM_TEMPLATE: template.yaml
  TESTING_STACK_NAME: friendly-doc-assistant-test
  TESTING_PIPELINE_EXECUTION_ROLE: arn:aws:iam::843553758024:role/aws-sam-cli-managed-test-pipe-PipelineExecutionRole-ownjmVvUdKX0
  TESTING_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::843553758024:role/aws-sam-cli-managed-test--CloudFormationExecutionRo-G2Cj1ibHvtS9
  TESTING_ARTIFACTS_BUCKET: aws-sam-cli-managed-test-pipeline--artifactsbucket-kxjn7mxkpitm
  TESTING_REGION: us-east-1

  - name: Show GitHub OIDC claims
  shell: bash
  run: |
    RESPONSE=$(curl \
      --silent \
      --show-error \
      --fail \
      -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

    ID_TOKEN=$(python3 -c \
      'import json,sys; print(json.load(sys.stdin)["value"])' \
      <<< "${RESPONSE}")

    ID_TOKEN="${ID_TOKEN}" python3 - <<'PY'
    import base64
    import json
    import os

    encoded = os.environ["ID_TOKEN"].split(".")[1]
    encoded += "=" * (-len(encoded) % 4)
    claims = json.loads(base64.urlsafe_b64decode(encoded))

    print("aud:", claims.get("aud"))
    print("sub:", claims.get("sub"))
    print("repository:", claims.get("repository"))
    print("repository_id:", claims.get("1347467002"))
    print("repository_owner_id:", claims.get("244645721"))
    print("ref:", claims.get("ref"))
    print("environment:", claims.get("environment"))
    PY
  PROD_STACK_NAME: friendly-doc-assistant-prod
  PROD_PIPELINE_EXECUTION_ROLE: arn:aws:iam::843553758024:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-2Cpjcr2c25uW
  PROD_CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::843553758024:role/aws-sam-cli-managed-prod--CloudFormationExecutionRo-xAdTja0oTLAd
  PROD_ARTIFACTS_BUCKET: aws-sam-cli-managed-prod-pipeline--artifactsbucket-mbapb5fmbnma
  PROD_REGION: us-east-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Install validation tools
        run: python -m pip install cfn-lint
      - name: Compile Python
        run: python -m compileall backend tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate SAM template
        run: sam validate --lint --template-file "${SAM_TEMPLATE}"

  build-and-package:
    needs: [validate]
    runs-on: ubuntu-24.04-arm 
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Build Linux ARM64 resources
        run: sam build --template "${SAM_TEMPLATE}" --use-container
      - name: Assume testing pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.TESTING_REGION }}
          role-session-name: github-testing-package
      - name: Package testing artifacts
        run: |
          sam package \
            --s3-bucket "${TESTING_ARTIFACTS_BUCKET}" \
            --region "${TESTING_REGION}" \
            --output-template-file packaged-testing.yaml
      - name: Save testing template
        uses: actions/upload-artifact@v4
        with:
          name: packaged-testing
          path: packaged-testing.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Assume production pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.PROD_REGION }}
          role-session-name: github-production-package
          unset-current-credentials: true
      - name: Package production artifacts
        run: |
          sam package \
            --s3-bucket "${PROD_ARTIFACTS_BUCKET}" \
            --region "${PROD_REGION}" \
            --output-template-file packaged-prod.yaml
      - name: Save production template
        uses: actions/upload-artifact@v4
        with:
          name: packaged-prod
          path: packaged-prod.yaml
          if-no-files-found: error
          retention-days: 7

  deploy-testing:
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download testing template
        uses: actions/download-artifact@v4
        with:
          name: packaged-testing
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Assume testing pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.TESTING_REGION }}
          role-session-name: github-testing-deploy
      - name: Deploy testing stack
        run: |
          sam deploy \
            --stack-name "${TESTING_STACK_NAME}" \
            --template-file packaged-testing.yaml \
            --capabilities CAPABILITY_IAM \
            --region "${TESTING_REGION}" \
            --s3-bucket "${TESTING_ARTIFACTS_BUCKET}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn "${TESTING_CLOUDFORMATION_EXECUTION_ROLE}" \
            --parameter-overrides \
              BedrockRegion=us-east-1 \
              EmbeddingModelId=amazon.titan-embed-text-v2:0 \
              LlmModelId=us.anthropic.claude-haiku-4-5-20251001-v1:0 \
              InferenceProfileId=global.anthropic.claude-haiku-4-5-20251001-v1:0 \
              UseInferenceProfile=true \
              LogRetentionDays=7

  publish-testing-frontend:
    needs: [deploy-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assume testing pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.TESTING_REGION }}
          role-session-name: github-testing-frontend
      - name: Publish testing frontend
        run: ./scripts/publish-frontend.sh "${TESTING_STACK_NAME}" "${TESTING_REGION}"

  integration-test:
    needs: [publish-testing-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assume testing pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TESTING_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.TESTING_REGION }}
          role-session-name: github-testing-smoke
      - name: Read testing endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${TESTING_STACK_NAME}" \
            --region "${TESTING_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"
      - name: Run API smoke test
        run: ./scripts/smoke-test.sh "${API_URL}"

  deploy-production:
    needs: [integration-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download production template
        uses: actions/download-artifact@v4
        with:
          name: packaged-prod
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Assume production pipeline role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PROD_PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.PROD_REGION }}
          role-session-name: github-production-deploy
      - name: Deploy production stack
        run: |
          sam deploy \
            --stack-name "${PROD_STACK_NAME}" \
            --template-file packaged-prod.yaml \
            --capabilities CAPABILITY_IAM \
            --region "${PROD_REGION}" \
            --s3-bucket "${PROD_ARTIFACTS_BUCKET}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn "${PROD_CLOUDFORMATION_EXECUTION_ROLE}" \
            --parameter-overrides \
              BedrockRegion=us-east-1 \
              EmbeddingModelId=amazon.titan-embed-text-v2:0 \
              LlmModelId=us.anthropic.claude-haiku-4-5-20251001-v1:0 \
              InferenceProfileId=global.anthropic.claude-haiku-4-5-20251001-v1:0 \
              UseInferenceProfile=true \
              LogRetentionDays=14
      - name: Publish production frontend
        run: ./scripts/publish-frontend.sh "${PROD_STACK_NAME}" "${PROD_REGION}"
      - name: Read production endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${PROD_STACK_NAME}" \
            --region "${PROD_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"
      - name: Run production API smoke test
        run: ./scripts/smoke-test.sh "${API_URL}"
